name: Sofascore
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi
      - run: python scripts/sofascore_fetch.py
      - name: Guardar JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/sofascore.json
          git diff --staged --quiet || (git commit -m "Actualizar datos Sofascore" && git push)

