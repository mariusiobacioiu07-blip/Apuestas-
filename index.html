<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A1310">
<title>Previa de partidos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0A1310;--bg2:#0E1A15;--card:#13221C;--card2:#1A2D25;--line:#22372F;--ink:#EAF2EC;--mut:#8DA396;--acc:#C8F560;--home:#3FD98A;--away:#F5A524;--red:#FF5D6C;--yel:#F2C230}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.45 "Source Sans 3",system-ui,sans-serif;background:radial-gradient(900px 420px at 50% -140px,#1D4331 0,transparent 70%),var(--bg);min-height:100vh}
main{max-width:640px;margin:0 auto;padding:22px 14px 56px}
header h1{font:700 52px/1 "Barlow Condensed",sans-serif;color:var(--ink);margin:6px 0 4px;letter-spacing:.01em}
header h1::after{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--acc);margin-left:8px;box-shadow:0 0 16px var(--acc)}
header p{color:var(--mut);margin:0 0 18px;max-width:34ch}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 15px;font:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:#35574A}
.chip[aria-pressed=true]{background:var(--acc);color:#0A1310;border-color:var(--acc);font-weight:600}
.chip:focus-visible,.fx>button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
summary{cursor:pointer;font-weight:600}
label{display:block;margin:10px 0;font-size:14px;color:var(--mut)}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--ink);font:inherit}
input::placeholder{color:#5d7367}
.dk{color:var(--ink);background:var(--card2);border-color:var(--line)}
.grp .dk{margin:6px 0}
.grp{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.gh{display:flex;align-items:center;gap:10px;padding:13px 16px;background:linear-gradient(90deg,var(--card2),var(--card))}
.gh img{width:24px;height:24px;object-fit:contain;flex:none}
.gd{font:700 19px "Barlow Condensed";letter-spacing:.02em}.gd::first-letter{text-transform:uppercase}
.gl{margin-left:auto;color:var(--mut);font-size:13px}
.fx{border-top:1px solid var(--line)}
.fx>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;width:100%;padding:14px 16px;cursor:pointer;transition:background .15s}
.fx>button:hover{background:var(--card2)}
.tc{text-align:center;border-right:1px solid var(--line);padding-right:12px}
.tc b{display:block;font:700 22px/1 "Barlow Condensed";color:var(--acc)}
.tc span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.ts{display:flex;flex-direction:column;gap:9px;min-width:0}
.tm{display:flex;align-items:center;gap:10px;font:700 19px/1.1 "Barlow Condensed";min-width:0}
.tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm img{width:26px;height:26px;object-fit:contain;flex:none}
.go{display:flex;align-items:center}
.go::after{content:"›";font-size:22px;line-height:1;transition:transform .2s;color:var(--acc)}
.fx>button[aria-expanded=true] .go::after{transform:rotate(90deg)}
.det{padding:6px 16px 18px;border-top:1px solid var(--line);background:var(--bg2)}
.vs{margin:9px 0}
.vt{display:grid;grid-template-columns:3.2em 1fr 3.2em;text-align:center;align-items:baseline}
.vt b{font:700 19px "Barlow Condensed"}.vt b:first-child{text-align:left}.vt b:last-child{text-align:right}
.vt span{font-size:13px;color:var(--mut)}
.vb{height:6px;border-radius:3px;background:var(--away);overflow:hidden;margin-top:2px}
.vb i{display:block;height:100%;background:var(--home);transition:width .4s}
.adv{color:var(--mut);font-size:14px;margin:6px 0 12px}
h3{font:700 20px "Barlow Condensed";margin:18px 0 6px;color:var(--acc);letter-spacing:.02em}
.fm span{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;color:#fff;font:600 11px "Source Sans 3";margin:0 1px}
.W{background:#1F9D61}.D{background:#6B7F73}.L{background:#D8353F}
.ai{background:var(--card2);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px;font-size:15px;white-space:pre-wrap;margin-top:8px}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.qa .chip{background:var(--card2);font-size:14px;padding:6px 12px}
.ask{display:flex;gap:6px}.ask input{margin:0}
.ask button{flex:none;border:0;background:var(--acc);color:#0A1310;border-radius:10px;padding:0 16px;font:600 15px "Source Sans 3";cursor:pointer}
.msg{color:var(--mut);padding:8px 0}.err{color:#FF8A95}
.sk{height:78px;border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,var(--card) 0,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.od{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.od b{display:block;font:700 26px/1.1 "Barlow Condensed";color:var(--acc)}
.od span{display:block;font-size:12px;color:var(--mut)}
footer{color:#6F8578;font-size:13px;margin-top:28px}
.adv{white-space:pre-line}
.vr{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:6px 0;font-size:14px}
.vr.ok{border-color:var(--home);box-shadow:inset 3px 0 0 var(--home)}
.vr button{margin-top:6px}
@media (prefers-reduced-motion:reduce){.vb i,.sk,.go::after{transition:none;animation:none}}
</style>
</head>
<body>
<main>
<header><h1>Previa</h1><p>Los datos del partido en una pantalla, antes de decidir nada.</p></header>
<details id="cfg"><summary>Claves</summary>
<label>football-data.org (obligatoria)<input id="k1" type="password" autocomplete="off" placeholder="Pega tu clave"></label>
<label>Gemini (resumen, preguntas y búsqueda web)<input id="k2" type="password" autocomplete="off" placeholder="Pega tu clave"></label>
<label>Grok (opcional)<input id="k3" type="password" autocomplete="off" placeholder="Pega tu clave"></label>
<label>Modelo de Grok (opcional, si sabes cuál usar)<input id="k4" autocomplete="off" placeholder="Ej: grok-4"></label>
<label>The Odds API (cuotas, opcional)<input id="k5" type="password" autocomplete="off" placeholder="Pega tu clave"></label>
<label>Tu banca en € (para calcular el stake, opcional)<input id="k6" inputmode="decimal" autocomplete="off" placeholder="Ej: 500"></label>
<button class="chip dk" id="save">Guardar</button>
<p class="msg">Se guardan solo en este navegador. Nunca las subas a GitHub.</p>
</details>
<div class="chips" id="chips"></div>
<div id="list"></div>
<footer>+18. Apostar conlleva riesgo de pérdida. Los datos orientan, no garantizan nada.</footer>
</main>
<script>
const LIGAS=[["La Liga","PD"],["Premier","PL"],["Bundesliga","BL1"],["Serie A","SA"],["Ligue 1","FL1"],["Eredivisie","DED"],["Liga Portugal","PPL"]];
const UND={PD:'La_liga',PL:'EPL',BL1:'Bundesliga',SA:'Serie_A',FL1:'Ligue_1'};
const ODDS={PD:'soccer_spain_la_liga',PL:'soccer_epl',BL1:'soccer_germany_bundesliga',SA:'soccer_italy_serie_a',FL1:'soccer_france_ligue_one',DED:'soccer_netherlands_eredivisie',PPL:'soccer_portugal_primeira_liga'};
let cur=null;
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const logo=u=>{const i=h('img');i.src=u||'';i.alt='';i.loading='lazy';return i};

/* ---------- datos ---------- */
const HR=3600e3,_n=new Date(),SEASON=_n.getMonth()<6?_n.getFullYear()-1:_n.getFullYear();
const ls=k=>localStorage.getItem(k)||'';
const cget=(k,ttl)=>{try{const c=JSON.parse(localStorage.getItem(k));if(c&&Date.now()-c.t<ttl)return c.v}catch{}return null};
const cset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify({t:Date.now(),v}))}catch{}};
async function fd(path,ttl){
  const hit=cget('f:'+path,ttl);if(hit)return hit;
  const t=ls('fdkey');if(!t)throw new Error('Abre "Claves" y pega tu clave de football-data.org.');
  let j;
  try{
    const r=await fetch('https://api.football-data.org/v4'+path,{headers:{'X-Auth-Token':t}});
    j=await r.json();if(!r.ok)throw new Error(j.message||'Error '+r.status);
  }catch(e){
    if(!(e instanceof TypeError))throw e;
    const r=await fetch('/api/fd?path='+encodeURIComponent(path),{headers:{'x-token':t}});
    j=await r.json();if(!r.ok)throw new Error(j.message||j.error||'Error '+r.status);
  }
  cset('f:'+path,j);return j;
}
const SIN=new Set('fc cf ac as sc ssc afc fsv rc rcd ud us sv vfl vfb tsg 1 fk ca real club de calcio 1899 1846 04 05 96'.split(' '));
const norm=n=>n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/munchen/g,'munich').replace(/koln/g,'cologne').replace(/internazionale/g,'inter').replace(/\bwolves\b/g,'wolverhampton wanderers').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w&&!SIN.has(w));
function findTeam(teams,name){
  const A=new Set(norm(name));let best=null,bs=0;
  for(const [t,v] of Object.entries(teams)){
    const B=new Set(norm(t)),i=[...A].filter(x=>B.has(x)).length,u=new Set([...A,...B]).size;
    let sc=u?i/u:0;if(i&&i===Math.min(A.size,B.size))sc=Math.max(sc,.5);
    if(sc>bs){bs=sc;best=v}
  }
  return bs>=0.4?best:null;
}
async function und(code){
  const sl=UND[code];if(!sl)return null;
  const hit=cget('u:'+sl+SEASON,6*HR);if(hit)return hit;
  try{const r=await fetch(`/api/understat?league=${sl}&season=${SEASON}`);if(!r.ok)return null;const j=await r.json();if(!j.teams)return null;cset('u:'+sl+SEASON,j);return j}catch{return null}
}
function last5(ms,team){
  const a=[...ms].sort((x,y)=>x.utcDate<y.utcDate?-1:1).slice(-5);let gf=0,ga=0,f='';
  a.forEach(m=>{const l=m.homeTeam.id===team,s=m.score.fullTime,g=l?s.home:s.away,c=l?s.away:s.home;gf+=g;ga+=c;f+=g>c?'W':g<c?'L':'D'});
  return {form:f,gf5:a.length?+(gf/a.length).toFixed(2):null,ga5:a.length?+(ga/a.length).toFixed(2):null};
}
async function fixtures(code){
  const d1=new Date().toISOString().slice(0,10),d2=new Date(Date.now()+14*864e5).toISOString().slice(0,10);
  const j=await fd(`/competitions/${code}/matches?dateFrom=${d1}&dateTo=${d2}`,6*HR);
  return (j.matches||[]).filter(m=>m.status==='SCHEDULED'||m.status==='TIMED').slice(0,12).map(m=>({id:m.id,date:m.utcDate,comp:m.competition?.emblem,compName:m.competition?.name,home:{id:m.homeTeam.id,name:m.homeTeam.name,logo:m.homeTeam.crest},away:{id:m.awayTeam.id,name:m.awayTeam.name,logo:m.awayTeam.crest}}));
}
async function previa(f,code){
  const hit=cget('p1:'+f.id,12*HR);if(hit)return hit;
  const hh=f.home.id,aa=f.away.id;
  const [st,rh,ra,U]=await Promise.all([fd(`/competitions/${code}/standings`,6*HR),fd(`/teams/${hh}/matches?status=FINISHED&limit=5`,12*HR),fd(`/teams/${aa}/matches?status=FINISHED&limit=5`,12*HR),und(code)]);
  const row=(t,id)=>(st.standings?.find(s=>s.type===t)?.table||[]).find(r=>r.team.id===id);
  const pp=(r,k)=>r&&r.playedGames?+(r[k]/r.playedGames).toFixed(2):null;
  const side=(id,ms,loc)=>{const T=row('TOTAL',id),L=row(loc,id);return {pos:T?.position??null,pts:T?.points??null,gf:pp(T,'goalsFor'),ga:pp(T,'goalsAgainst'),gfLoc:pp(L,'goalsFor'),gaLoc:pp(L,'goalsAgainst'),...last5(ms.matches||[],id)}};
  const out={stats:{home:side(hh,rh,'HOME'),away:side(aa,ra,'AWAY')}};
  const uh=U&&findTeam(U.teams,f.home.name),ua=U&&findTeam(U.teams,f.away.name);
  if(uh&&ua){
    Object.assign(out.stats.home,{xg:uh.l5.xg,xga:uh.l5.xga,xgLoc:uh.h.xg,xgaLoc:uh.h.xga});
    Object.assign(out.stats.away,{xg:ua.l5.xg,xga:ua.l5.xga,xgLoc:ua.a.xg,xgaLoc:ua.a.xga});
    out.fuenteXg='Understat';
  }
  const sf=await sfc(f);
  if(sf){
    out.sf=sf;
    if(!out.fuenteXg&&sf.home.xg!=null&&sf.away.xg!=null){
      Object.assign(out.stats.home,{xg:sf.home.xg,xga:sf.home.xga,xgLoc:sf.home.xg,xgaLoc:sf.home.xga});
      Object.assign(out.stats.away,{xg:sf.away.xg,xga:sf.away.xga,xgLoc:sf.away.xg,xgaLoc:sf.away.xga});
      out.fuenteXg='Sofascore (últimos 5)';
    }
  }
  out.ai=await gem(`Resume en español, en máximo 5 líneas, la previa de ${f.home.name} vs ${f.away.name} usando SOLO estos datos. Destaca tendencias. No des marcador exacto ni recomiendes apuestas.\n${JSON.stringify(out)}`);
  if(!gem.fail)cset('p1:'+f.id,out);return out;
}

/* ---------- cuotas ---------- */
async function cuotas(code){
  const sp=ODDS[code],k=ls('oddskey');if(!sp||!k)return null;
  const hit=cget('o:'+code,6*HR);if(hit)return hit;
  try{
    const r=await fetch('/api/odds?sport='+sp,{headers:{'x-token':k}});
    const j=await r.json();
    if(!r.ok||!Array.isArray(j))return {error:(j&&(j.message||j.error))||('Error '+r.status)};
    const v={ev:j,rest:r.headers.get('x-requests-remaining')};cset('o:'+code,v);return v;
  }catch(e){return {error:e.message}}
}
function cuotasPartido(O,f){
  if(!O||!O.ev)return null;
  const mp={};O.ev.forEach(e=>mp[e.home_team]=e);
  const ev=findTeam(mp,f.home.name);
  if(!ev||!findTeam({[ev.away_team]:1},f.away.name))return null;
  const best={h:0,d:0,a:0},P={h:0,d:0,a:0},ou={o:0,u:0,po:0,pu:0,n:0};let nb=0;
  ev.bookmakers.forEach(b=>{
    const h2=b.markets.find(m=>m.key==='h2h');
    if(h2){
      const g=n=>h2.outcomes.find(o=>o.name===n)?.price,h=g(ev.home_team),a=g(ev.away_team),d=g('Draw');
      if(h&&a&&d){best.h=Math.max(best.h,h);best.d=Math.max(best.d,d);best.a=Math.max(best.a,a);const t=1/h+1/d+1/a;P.h+=1/h/t;P.d+=1/d/t;P.a+=1/a/t;nb++}
    }
    const t=b.markets.find(m=>m.key==='totals');
    if(t){
      const o=t.outcomes.find(x=>x.name==='Over'&&x.point===2.5),u=t.outcomes.find(x=>x.name==='Under'&&x.point===2.5);
      if(o&&u){ou.o=Math.max(ou.o,o.price);ou.u=Math.max(ou.u,u.price);const z=1/o.price+1/u.price;ou.po+=1/o.price/z;ou.pu+=1/u.price/z;ou.n++}
    }
  });
  if(!nb)return null;
  const pc=x=>Math.round(x*100);
  return {casas:nb,local:{cuota:best.h,prob:pc(P.h/nb)},empate:{cuota:best.d,prob:pc(P.d/nb)},visitante:{cuota:best.a,prob:pc(P.a/nb)},
    mas25:ou.n?{cuota:ou.o,prob:pc(ou.po/ou.n)}:null,menos25:ou.n?{cuota:ou.u,prob:pc(ou.pu/ou.n)}:null};
}

/* ---------- IA ---------- */
const MODELOS=['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-flash-latest','gemini-flash-lite-latest','gemini-3.8-flash','gemini-3.8-flash-lite','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-3-flash-preview'];
async function gem(text,sys,web){
  gem.fail=false;
  const k=ls('gmkey');if(!k)return '';
  const body={contents:[{parts:[{text}]}]};
  if(sys)body.systemInstruction={parts:[{text:sys}]};
  if(web)body.tools=[{google_search:{}}];
  const pref=ls('gmodel'),orden=pref?[pref,...MODELOS.filter(x=>x!==pref)]:MODELOS;
  const fallos=[];let msg429='';
  for(const m of orden){
    try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const j=await r.json();
      const t=j?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('');
      if(t){
        localStorage.setItem('gmodel',m);
        const fu=[...new Set((j.candidates[0].groundingMetadata?.groundingChunks||[]).map(c=>c.web?.title).filter(Boolean))].slice(0,5);
        return t+(fu.length?'\n\nFuentes: '+fu.join(', '):'');
      }
      const msg=j?.error?.message||'Respuesta vacía';
      if(/api key not valid|API_KEY_INVALID/i.test(msg)||j?.error?.status==='PERMISSION_DENIED'){gem.fail=true;return 'Clave de Gemini no válida: '+msg}
      let why=msg.slice(0,90);
      if(r.status===404)why='el modelo no existe';
      else if(r.status===429){if(!msg429)msg429=msg;why=/limit:\s*0/.test(msg)?'no incluido en el plan gratuito (límite 0)':'cuota agotada'+((msg.match(/retry in ([\d.]+)s/i)||[])[1]?' (reintenta en '+Math.ceil(msg.match(/retry in ([\d.]+)s/i)[1])+' s)':'')}
      fallos.push(m+' → '+why);
    }catch(e){fallos.push(m+' → '+e.message)}
  }
  gem.fail=true;
  const reales=fallos.filter(x=>!x.includes('no existe'));
  return 'Ningún modelo de Gemini respondió.\n'+(reales.length?reales:fallos).join('\n')+(msg429?'\n\nMensaje exacto de Google: '+msg429.slice(0,300):'')+(web?'\n\nLa búsqueda web tiene su propio límite gratuito, más bajo que el del texto normal.':'')+'\nSi todo es cuota: espera al reinicio diario (sobre las 9:00 en España) o crea una clave nueva en aistudio.google.com en un proyecto nuevo.';
}
const MG=['grok-4-fast-reasoning','grok-4-fast','grok-4','grok-3'];
async function grok(text,sys){
  grok.fail=false;
  const k=ls('xkey');if(!k)return '';
  const H={'Content-Type':'application/json',Authorization:'Bearer '+k},pref=ls('xmodel');
  let fallo='';
  for(const m of [...(pref?[pref]:[]),...MG.filter(x=>x!==pref)]){
    try{
      const r=await fetch('https://api.x.ai/v1/responses',{method:'POST',headers:H,body:JSON.stringify({model:m,input:[...(sys?[{role:'system',content:sys}]:[]),{role:'user',content:text}],tools:[{type:'web_search'},{type:'x_search'}]})});
      const j=await r.json();
      const t=j.output_text||(j.output||[]).flatMap(o=>o.content||[]).map(c=>c.text).filter(Boolean).join('\n');
      if(t)return t;
      grok.fail=true;
      const msg=typeof j.error==='string'?j.error:(j.error?.message||j.message||'Respuesta vacía');
      if(r.status===401||r.status===403){grok.fail=true;return 'Clave de Grok no válida: '+msg}
      fallo=m+': '+msg;
    }catch(e){fallo=m+': '+e.message}
  }
  grok.fail=true;
  return 'Ningún modelo de Grok respondió. Último error → '+fallo;
}
async function ia(text,sys,web){
  const r=await gem(text,sys,web);
  if(r&&!gem.fail)return r;
  if(!ls('xkey'))return r;
  const g=await grok(text,sys);
  if(g&&!grok.fail)return 'Gemini falló; respuesta de Grok:\n\n'+g;
  return (r?r+'\n\n':'')+(g||'');
}
const BUSCA='Eres un analista de datos de fútbol. Busca en la web y responde en español. No inventes cifras: si no encuentras un dato escribe "no encontrado". Indica la fuente y la fecha de los datos importantes. No des apuestas ni marcador.';
const REGLAS='Eres un analista de fútbol prudente. Responde en español, claro y en máximo 8 líneas. Usa SOLO los datos JSON del partido. Si incluyen informes o bajas obtenidos de la web, úsalos pero avisa de que no están verificados. Propón un mercado (1X2, doble oportunidad, más/menos goles, ambos marcan, hándicap) únicamente si al menos dos datos concretos lo respaldan, y cítalos (xG, goles, local/visitante, bajas). Si los datos no bastan o faltan, dilo en vez de forzar una apuesta. Si el JSON incluye cuotas, compara la probabilidad implícita del mercado con lo que respaldan los datos y señala dónde podría haber valor, sin prometer nada. Si no hay cuotas ni las da el usuario, aclara que no puedes saber si hay valor, solo si los datos lo respaldan. Nunca hables de apuestas seguras ni prometas ganancias.';

/* ---------- Sofascore ---------- */
async function sfc(f){try{let D=cget('fd',HR);if(!D){const r=await fetch('/data/fdco.json');if(!r.ok)return null;D=await r.json();cset('fd',D)}const a=findTeam(D.teams||{},f.home.name),b=findTeam(D.teams||{},f.away.name);return a&&b?{home:a,away:b}:null}catch{return null}}

/* ---------- modelo Poisson ---------- */
const pois=(l,k)=>{let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p};
const pOver=(l,line)=>{let c=0;for(let k=0;k<=Math.floor(line);k++)c+=pois(l,k);return 1-c};
function modelo(s,sf){
  const m=(a,b)=>a!=null&&b!=null?(a+b)/2:(a??b);
  const att=x=>m(x.xgLoc??x.gfLoc,x.xg??x.gf5),def=x=>m(x.xgaLoc??x.gaLoc,x.xga??x.ga5);
  let lh=m(att(s.home),def(s.away)),la=m(att(s.away),def(s.home));
  if(lh==null||la==null||isNaN(lh)||isNaN(la))return null;
  const aj=b=>{b=b||[];const o=b.filter(x=>x.pos==='F'||x.pos==='M').length,d=b.filter(x=>x.pos==='D'||x.pos==='G').length;return [Math.max(.9,1-.03*o),Math.min(1.08,1+.025*d),o+d]};
  const A=aj(sf?.home?.bajas),B=aj(sf?.away?.bajas);
  lh*=A[0]*B[1];la*=B[0]*A[1];
  let h=0,d=0,a=0,o=0,o15=0,o35=0,bt=0;
  for(let i=0;i<=8;i++)for(let j=0;j<=8;j++){const p=pois(lh,i)*pois(la,j);i>j?h+=p:i<j?a+=p:d+=p;if(i+j>2.5)o+=p;if(i+j>1.5)o15+=p;if(i+j>3.5)o35+=p;if(i&&j)bt+=p}
  const t=h+d+a;
  return {lh,la,h:h/t,d:d/t,a:a/t,o25:o/t,u25:1-o/t,o15:o15/t,o35:o35/t,btts:bt/t,aj:(A[2]+B[2])?A[2]+' local, '+B[2]+' visitante':''};
}
function sharp(O,f){
  if(!O||!O.ev)return null;
  const mp={};O.ev.forEach(e=>mp[e.home_team]=e);const ev=findTeam(mp,f.home.name);if(!ev)return null;
  const b=ev.bookmakers.find(x=>x.key==='pinnacle');const h2=b&&b.markets.find(m=>m.key==='h2h');if(!h2)return null;
  const g=n=>h2.outcomes.find(o=>o.name===n)?.price,h=g(ev.home_team),a=g(ev.away_team),d=g('Draw');if(!(h&&a&&d))return null;
  const t=1/h+1/d+1/a,r={h:1/h/t,d:1/d/t,a:1/a/t};
  const tt=b.markets.find(m=>m.key==='totals'),o=tt&&tt.outcomes.find(x=>x.name==='Over'&&x.point===2.5),u=tt&&tt.outcomes.find(x=>x.name==='Under'&&x.point===2.5);
  if(o&&u){const z=1/o.price+1/u.price;r.o25=1/o.price/z;r.u25=1/u.price/z}
  return r;
}

/* ---------- apuestas registradas ---------- */
const bets=()=>{try{return JSON.parse(localStorage.getItem('bets'))||[]}catch{return[]}},svb=b=>localStorage.setItem('bets',JSON.stringify(b));
function apuestas(){
  list.replaceChildren();const B=bets(),box=h('div','grp');box.style.padding='16px';
  const done=B.filter(b=>b.res),st=done.reduce((s,b)=>s+b.stake,0),pf=done.reduce((s,b)=>s+(b.res==='G'?b.stake*(b.odd-1):b.res==='P'?-b.stake:0),0);
  const cl=B.filter(b=>b.close),clv=cl.length?cl.reduce((s,b)=>s+(b.odd/b.close-1),0)/cl.length:null;
  box.append(h('p','adv',`Registradas: ${B.length} · resueltas: ${done.length}\nBeneficio: ${pf.toFixed(2)} · ROI: ${st?(pf/st*100).toFixed(1)+'%':'n/d'}\nCLV medio: ${clv!=null?(clv*100).toFixed(1)+'%':'n/d (anota la cuota de cierre de cada apuesta)'}\nCLV positivo sostenido es la mejor señal de que tu método tiene ventaja real.`));
  if(!B.length)box.append(h('div','msg','Aún no has registrado ninguna. Pulsa "Registrar" en una apuesta con valor.'));
  B.slice().reverse().forEach(b=>{
    const r=h('div','vr');r.append(h('span',null,`${b.m} · ${b.mk} @${b.odd.toFixed(2)} · stake ${b.stake} · ${b.res==='G'?'✅ ganada':b.res==='P'?'❌ perdida':b.res==='N'?'nula':'pendiente'}`));
    const bx=h('div','qa');
    [['G','Ganada'],['P','Perdida'],['N','Nula']].forEach(([v,t])=>{const x=h('button','chip dk',t);x.onclick=()=>{b.res=v;svb(B);apuestas()};bx.append(x)});
    const ci=h('input');ci.placeholder='Cuota de cierre';ci.value=b.close||'';ci.onchange=()=>{b.close=parseFloat(ci.value.replace(',','.'))||null;svb(B);apuestas()};
    const del=h('button','chip dk','Borrar');del.onclick=()=>{B.splice(B.indexOf(b),1);svb(B);apuestas()};bx.append(del);
    r.append(bx,ci);box.append(r);
  });
  list.append(box);
}

/* ---------- panel de modelo + valor ---------- */
function pintaModelo(box,M,sf,cu,sh,f){
  const pc=x=>(x*100).toFixed(0)+'%';
  box.append(h('h3',null,'Modelo Poisson'));
  if(!M){box.append(h('div','adv','Faltan datos de goles o xG para calcular el modelo.'));return}
  const g=h('div','odds');
  [['1 Local',M.h],['X Empate',M.d],['2 Visitante',M.a],['Más 2,5',M.o25],['Ambos marcan',M.btts],['Más 3,5',M.o35]].forEach(([t,x])=>{const c=h('div','od');c.append(h('b',null,pc(x)),h('span',null,t),h('span',null,'cuota justa '+(1/x).toFixed(2)));g.append(c)});
  box.append(g,h('div','adv',`Goles esperados: ${M.lh.toFixed(2)} – ${M.la.toFixed(2)}`+(M.aj?`\nAjuste por bajas (heurístico): ${M.aj}.`:'')));
  if(sf){
    const H=sf.home,A=sf.away,l=[];
    const co=[H.cf,A.ca,A.cf,H.ca].every(x=>x!=null)?(H.cf+A.ca)/2+(A.cf+H.ca)/2:null,ta=H.cards!=null&&A.cards!=null?H.cards+A.cards:null;
    if(co)l.push(`Córners esperados ${co.toFixed(1)} · más de 9,5: ${pc(pOver(co,9))} (cuota justa ${(1/pOver(co,9)).toFixed(2)})`);
    if(ta)l.push(`Amarillas esperadas ${ta.toFixed(1)} · más de 4,5: ${pc(pOver(ta,4))} (cuota justa ${(1/pOver(ta,4)).toFixed(2)})`);
    const bj=k=>(sf[k].bajas||[]).map(b=>b.n+' ('+b.pos+')').join(', ')||'ninguna';
    if(sf.home.bajas)l.push('Bajas (Sofascore) · '+corto(f.home.name)+': '+bj('home')+' · '+corto(f.away.name)+': '+bj('away'));
    box.append(h('div','adv',l.join('\n')+'\nCórners y tarjetas (football-data.co.uk): Poisson sobre los últimos 5 de cada equipo, orientativo; compáralo con la cuota de tu casa.'));
  }
  box.append(h('h3',null,'Valor'));
  if(!cu){box.append(h('div','adv','Sin cuotas no se puede calcular el valor.'));return}
  const banca=parseFloat(ls('banca').replace(',','.'))||0,rows=[['1 Local','h',cu.local],['X Empate','d',cu.empate],['2 Visitante','a',cu.visitante]];
  if(cu.mas25)rows.push(['Más 2,5','o25',cu.mas25],['Menos 2,5','u25',cu.menos25]);
  let n=0;
  rows.forEach(([t,k,x])=>{
    const pm=M[k],ps=sh?sh[k]:null,p=ps!=null?ps:pm,ev=p*x.cuota-1,kel=Math.max(0,Math.min(.03,ev/(x.cuota-1)*.25)),val=ps!=null&&ev>.05;
    const r=h('div','vr'+(val?' ok':''));
    r.append(h('span',null,`${t} @${x.cuota.toFixed(2)} · modelo ${pc(pm)}`+(ps!=null?` · Pinnacle ${pc(ps)}`:'')+` · EV ${(ev*100).toFixed(1)}%`));
    if(val){
      n++;const stake=banca?+(banca*kel).toFixed(2):1;
      r.append(h('div',null,'Valor. Stake sugerido (¼ Kelly, máx. 3%): '+(banca?stake+' €':'1 unidad; pon tu banca en "Claves"')));
      const b=h('button','chip dk','Registrar');b.onclick=()=>{const B=bets();B.push({m:corto(f.home.name)+' vs '+corto(f.away.name),mk:t,odd:x.cuota,stake,res:null,close:null});svb(B);b.textContent='Guardada';b.disabled=true};r.append(b);
    }
    box.append(r);
  });
  box.append(h('div','adv',(n?'Marcado = la mejor cuota paga más de un 5% sobre la probabilidad de Pinnacle sin margen. ':'Ningún mercado supera el 5% de EV: lo normal es no apostar. ')+(sh?'La probabilidad usada es la de Pinnacle sin margen. El modelo Poisson es solo orientativo: en el backtest no mejoró al mercado.':'Sin Pinnacle no se marca valor: el modelo solo no es fiable.')));
  const kmv='mv:'+f.id,prev=cget(kmv,14*864e5);
  if(prev)['local','empate','visitante'].forEach(k=>{const d=cu[k].cuota/prev[k]-1;if(Math.abs(d)>=.05)box.append(h('div','adv','⚠ Cuota '+k+' '+(d>0?'sube':'baja')+' un '+Math.abs(d*100).toFixed(0)+'% desde tu última consulta.'))});
  cset(kmv,{local:cu.local.cuota,empate:cu.empate.cuota,visitante:cu.visitante.cuota});
}

/* ---------- interfaz ---------- */
const cfg=document.getElementById('cfg'),K=[1,2,3,4,5,6].map(n=>document.getElementById('k'+n)),KS=['fdkey','gmkey','xkey','xmodel','oddskey','banca'];
KS.forEach((k,i)=>K[i].value=ls(k));if(!ls('fdkey'))cfg.open=true;
document.getElementById('save').onclick=()=>{KS.forEach((k,i)=>localStorage.setItem(k,K[i].value.trim()));cfg.open=false};
const chips=document.getElementById('chips'),list=document.getElementById('list');
const pulsar=btn=>chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===btn));
LIGAS.forEach(([n,code])=>{const b=h('button','chip',n);b.setAttribute('aria-pressed','false');b.onclick=()=>load(code,b);chips.append(b)});
const ob=h('button','chip','Otras ligas y partido libre');ob.setAttribute('aria-pressed','false');ob.onclick=()=>{pulsar(ob);libre()};chips.append(ob);
const mb=h('button','chip','Mis apuestas');mb.setAttribute('aria-pressed','false');mb.onclick=()=>{pulsar(mb);apuestas()};chips.append(mb);

const corto=n=>n.replace(/\s+(A?FC|CF)$/,'').replace(/ & Hove Albion/,'').replace(/Wolverhampton Wanderers/,'Wolves');
async function load(code,btn){
  cur=code;pulsar(btn);
  list.replaceChildren(h('div','sk'),h('div','sk'),h('div','sk'));
  try{
    const fx=await fixtures(code);
    list.replaceChildren();
    if(!fx.length){list.append(h('div','msg','No hay partidos programados en los próximos 14 días.'));return}
    let last='',grp=null;const hoy=new Date().toDateString();
    fx.forEach(f=>{
      const d=new Date(f.date),day=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
      if(day!==last){
        last=day;grp=h('div','grp');
        const gh=h('div','gh');if(f.comp)gh.append(logo(f.comp));
        gh.append(h('span','gd',day),h('span','gl',f.compName||''));grp.append(gh);list.append(grp);
      }
      const card=h('div','fx'),b=h('button');b.setAttribute('aria-expanded','false');
      const tc=h('span','tc');tc.append(h('b',null,d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})),h('span',null,d.toDateString()===hoy?'Hoy':''));
      const t1=h('span','tm');t1.append(logo(f.home.logo),h('span',null,corto(f.home.name)));
      const t2=h('span','tm');t2.append(logo(f.away.logo),h('span',null,corto(f.away.name)));
      const ts=h('span','ts');ts.append(t1,t2);
      b.append(tc,ts,h('span','go'));
      const box=h('div','det');box.hidden=true;let done=false;
      b.onclick=()=>{box.hidden=!box.hidden;b.setAttribute('aria-expanded',String(!box.hidden));if(!box.hidden&&!done){done=true;detail(f,box)}};
      card.append(b,box);grp.append(card);
    });
  }catch(e){list.replaceChildren(h('div','msg err',e.message))}
}

const form=s=>{const w=h('span','fm');[...(s||'')].forEach(c=>w.append(h('span',c,c)));return w};
const vs=(lab,a,b,nobar)=>{
  const r=h('div','vs'),na=parseFloat(a),nb=parseFloat(b),ok=!nobar&&!isNaN(na)&&!isNaN(nb)&&na+nb>0;
  const t=h('div','vt');t.append(h('b',null,a??'n/d'),h('span',null,lab),h('b',null,b??'n/d'));r.append(t);
  if(ok){const bar=h('div','vb'),i=h('i');i.style.width=(na/(na+nb)*100)+'%';bar.append(i);r.append(bar)}
  return r;
};
function preguntas(box,ctx){
  box.append(h('h3',null,'Pregunta a la IA'));
  const out=h('div','ai');out.hidden=true;
  const ask=async t=>{
    if(!t.trim())return;out.hidden=false;out.textContent='Pensando…';
    const q=`Pregunta: ${t}\nDatos del partido:\n${JSON.stringify(ctx)}`;
    const r=await ia(q,REGLAS);
    out.textContent=r||'Añade tu clave de Gemini o Grok en "Claves".';
  };
  const qa=h('div','qa');
  ['¿Qué apuestas respaldan los datos?','¿Más o menos de 2,5 goles?','¿Ambos marcan?','¿Cómo pesan las bajas?'].forEach(t=>{const b=h('button','chip',t);b.onclick=()=>ask(t);qa.append(b)});
  const row=h('div','ask'),inp=h('input');inp.placeholder='Escribe tu pregunta o pega cuotas';
  const go=h('button',null,'Preguntar');go.onclick=()=>ask(inp.value);row.append(inp,go);
  box.append(qa,row,out);
}

async function detail(f,box){
  box.append(h('div','msg','Cargando datos…'));
  try{
    const d=await previa(f,cur),s=d.stats;
    box.replaceChildren();
    box.append(h('h3',null,'Cara a cara'));
    const fr=h('div','vt');fr.style.gridTemplateColumns='1fr auto 1fr';
    fr.append(form(s.home.form),h('span',null,'Últimos 5'),form(s.away.form));fr.lastChild.style.textAlign='right';
    const fw=h('div','vs');fw.append(fr);box.append(fw);
    const ps=x=>x.pos!=null?x.pos+'º · '+x.pts+' pts':null;
    box.append(vs('Clasificación',ps(s.home),ps(s.away),true),
      vs('Goles a favor por partido',s.home.gf,s.away.gf),vs('Goles en contra por partido',s.home.ga,s.away.ga),
      vs('Goles a favor: local en casa, visitante fuera',s.home.gfLoc,s.away.gfLoc),vs('Goles en contra: local en casa, visitante fuera',s.home.gaLoc,s.away.gaLoc),
      vs('Goles a favor (últimos 5)',s.home.gf5,s.away.gf5),vs('Goles en contra (últimos 5)',s.home.ga5,s.away.ga5));
    if(s.home.xg!=null)box.append(vs('xG a favor (últimos 5)',s.home.xg,s.away.xg),vs('xG en contra (últimos 5)',s.home.xga,s.away.xga),
      vs('xG a favor: local en casa, visitante fuera',s.home.xgLoc,s.away.xgLoc),vs('xG en contra: local en casa, visitante fuera',s.home.xgaLoc,s.away.xgaLoc));
    box.append(h('div','adv',d.fuenteXg?'Fuente del xG: '+d.fuenteXg+'.':'Sin xG para este partido (solo las 5 grandes, y si Understat responde).'));
    const O=await cuotas(cur),cu=cuotasPartido(O,f);
    box.append(h('h3',null,'Cuotas'));
    if(cu){
      const od=h('div','odds');
      [['1 · Local',cu.local],['X · Empate',cu.empate],['2 · Visitante',cu.visitante]].forEach(([t,x])=>{const c=h('div','od');c.append(h('b',null,x.cuota.toFixed(2)),h('span',null,t),h('span',null,'mercado: '+x.prob+'%'));od.append(c)});
      box.append(od);
      if(cu.mas25){const o2=h('div','odds');o2.style.gridTemplateColumns='1fr 1fr';[['Más de 2,5',cu.mas25],['Menos de 2,5',cu.menos25]].forEach(([t,x])=>{const c=h('div','od');c.append(h('b',null,x.cuota.toFixed(2)),h('span',null,t),h('span',null,'mercado: '+x.prob+'%'));o2.append(c)});box.append(o2)}
      box.append(h('div','adv','Mejor cuota entre '+cu.casas+' casas. El % es la probabilidad que descuenta el mercado, sin margen.'+(O.rest?' Créditos restantes este mes: '+O.rest+'.':'')));
    }else box.append(h('div','adv',!ls('oddskey')?'Añade tu clave de The Odds API en "Claves" para ver las cuotas.':(O&&O.error)?'Cuotas no disponibles: '+O.error:'No encontré cuotas para este partido (puede que aún no estén publicadas).'));
    const M=modelo(s,d.sf),sh=sharp(O,f);
    pintaModelo(box,M,d.sf,cu,sh,f);
    const ctx={partido:f.home.name+' (local) vs '+f.away.name+' (visitante)',datos:s,cuotas:cu,modeloPoisson:M,pinnacle:sh,bajasSofascore:d.sf?{local:d.sf.home.bajas,visitante:d.sf.away.bajas}:null,leyenda:'gf/ga = goles por partido de la temporada; gfLoc/gaLoc = del local en casa o del visitante fuera; gf5/ga5 y form = últimos 5 partidos; xg/xga = últimos 5 (Understat); xgLoc/xgaLoc = temporada como local en casa o visitante fuera.'};
    if(d.ai)box.append(h('h3',null,'Resumen'),h('div','ai',d.ai));
    box.append(h('h3',null,'Bajas'));
    const bb=h('button','chip dk','Buscar bajas con IA'),bo=h('div','ai');bo.hidden=true;
    bb.onclick=async()=>{
      bo.hidden=false;bo.textContent='Buscando…';
      const q=`Bajas, lesionados, sancionados y dudas confirmados para el partido ${f.home.name} vs ${f.away.name}. Para cada equipo lista jugador, motivo y fuente. Si no hay información fiable escribe "no encontrado".`;
      const r=await ia(q,BUSCA,true);
      bo.textContent=r||'Añade tu clave de Gemini o Grok en "Claves".';ctx.bajasWeb=r;
    };
    const mi=h('input');mi.placeholder='O pega aquí las bajas que hayas encontrado';mi.style.marginTop='8px';mi.oninput=()=>{ctx.bajasWeb=mi.value};
    box.append(bb,bo,mi);
    preguntas(box,ctx);
  }catch(e){box.replaceChildren(h('div','msg err',e.message))}
}

function libre(){
  list.replaceChildren();
  const box=h('div','grp');box.style.padding='16px';
  box.append(h('p','adv','Para 2. Bundesliga, Rumanía, Turquía, Suiza, Bélgica o cualquier otro partido: la IA busca los datos en la web. Pueden tener errores, contrasta lo importante.'));
  const l1=h('label',null,'Partido'),inp=h('input');inp.placeholder='Ej: Galatasaray vs Fenerbahçe';l1.append(inp);
  const l2=h('label',null,'IA'),sel=h('select');
  [['gemini','Gemini'],['grok','Grok'],['ambas','Las dos']].forEach(([v,t])=>{const o=h('option',null,t);o.value=v;sel.append(o)});l2.append(sel);
  const go=h('button','chip dk','Buscar datos'),res=h('div'),ctx={informes:{}};let hecho=false;
  go.onclick=async()=>{
    const m=inp.value.trim();if(!m)return;
    res.replaceChildren();ctx.partido=m;ctx.informes={};
    const p=`Busca datos actuales del partido ${m} y responde con este formato:\n1) Cuándo y dónde se juega.\n2) Forma de cada equipo (últimos 5 resultados).\n3) Estadísticas clave: goles a favor y en contra por partido, xG y xGA si los encuentras (con la fuente), y rendimiento como local o visitante.\n4) Bajas y dudas confirmadas (jugador, motivo, fuente).\n5) Últimos enfrentamientos directos.`;
    const quien=sel.value==='ambas'?['gemini','grok']:[sel.value];
    await Promise.all(quien.map(async q=>{
      const t=h('div','ai','Buscando…');res.append(h('h3',null,q==='gemini'?'Gemini':'Grok'),t);
      const x=await(q==='gemini'?gem(p,BUSCA,true):grok(p,BUSCA));
      t.textContent=x||'Añade tu clave de '+(q==='gemini'?'Gemini':'Grok')+' en "Claves".';ctx.informes[q]=t.textContent;
    }));
    if(!hecho){hecho=true;preguntas(box,ctx)}
  };
  box.append(l1,l2,go,res);list.append(box);
}
